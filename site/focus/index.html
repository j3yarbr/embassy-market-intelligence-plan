    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Route each row to the correct live cluster by its color field
        // (row[3]) instead of assuming everything belongs to one cluster.
        // The variable names below are injected from Python at build time
        // via get_name(), so they always match this specific export.
        var embassyClusterByColor = {
            "#DC3232": fast_marker_cluster_431e83bf2ad92c8d011c0aeb8703baa8,
            "#0066CC": fast_marker_cluster_66cbab8ce6a61d7b75ae9e89634c3c17
        };

        fetch("data.json")
          .then(response => response.json())
          .then(function(rows) {
              // Build markers grouped by [category][color] up front, then
              // hand each group to addLayers() in bulk. Leaflet.markercluster
              // rebuilds its spatial index on every individual addLayer/addTo
              // call, so adding 100k+ markers one at a time freezes the tab
              // for minutes (worse on iPad); addLayers() bulk-loads in a
              // single pass, and the same grouping doubles as the data the
              // category filter panel toggles on and off.
              var markersByCategory = {};

              for (var i = 0; i < rows.length; i++) {
                  var row = rows[i];
                  var color = row[3];
                  var category = row[4] || "Other";
                  if (!embassyClusterByColor.hasOwnProperty(color)) {
                      console.warn("No cluster mapped for color:", color);
                      continue;
                  }
                  if (!markersByCategory[category]) {
                      markersByCategory[category] = {};
                  }
                  if (!markersByCategory[category][color]) {
                      markersByCategory[category][color] = [];
                  }
                  markersByCategory[category][color].push(embassyCallback(row));
              }

              // Initial load: every category visible.
              for (var category in markersByCategory) {
                  for (var color in markersByCategory[category]) {
                      embassyClusterByColor[color].addLayers(markersByCategory[category][color]);
                  }
              }

              // Floating checkbox panel, one row per category, all checked.
              var panel = L.control({position: 'topright'});
              panel.onAdd = function() {
                  var div = L.DomUtil.create('div', 'embassy-category-filter');
                  div.style.background = 'white';
                  div.style.padding = '8px 10px';
                  div.style.maxHeight = '260px';
                  div.style.overflowY = 'auto';
                  div.style.fontSize = '13px';
                  div.style.lineHeight = '1.5';
                  div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.3)';
                  div.style.borderRadius = '4px';
                  var html = '<div style="font-weight:700;margin-bottom:6px;">Categories</div>';
                  Object.keys(markersByCategory).sort().forEach(function(cat) {
                      html += '<label style="display:block;white-space:nowrap;">'
                            + '<input type="checkbox" checked class="embassy-cat-toggle" data-category="'
                            + cat.replace(/"/g, '&quot;') + '"> ' + cat + '</label>';
                  });
                  div.innerHTML = html;
                  L.DomEvent.disableClickPropagation(div);
                  return div;
              };
              panel.addTo(map_b5c1a18312c83bfd13d257d168d525ce);

              document.querySelectorAll('.embassy-cat-toggle').forEach(function(box) {
                  box.addEventListener('change', function() {
                      var byColor = markersByCategory[this.getAttribute('data-category')];
                      for (var color in byColor) {
                          var target = embassyClusterByColor[color];
                          if (this.checked) {
                              target.addLayers(byColor[color]);
                          } else {
                              target.removeLayers(byColor[color]);
                          }
                      }
                  });
              });
          })
          .catch(function(err) {
              console.error("JSON load failed:", err);
          });
    });
    </script>

            var fast_marker_cluster_431e83bf2ad92c8d011c0aeb8703baa8 = (function(){
                var callback = embassyCallback;

                var data = [];
                var cluster = L.markerClusterGroup({
  "disableClusteringAtZoom": 11,
});
                cluster.options.iconCreateFunction =
                    function(c) {
                    var n = c.getChildCount();
                    return L.divIcon({
                        html: '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">' + n + '</div>',
                        className: 'red-cluster',
                        iconSize: L.point(32, 32)
                    });
                };

                for (var i = 0; i < data.length; i++) {
                    var row = data[i];
                    var marker = callback(row);
                    marker.addTo(cluster);
                }

                cluster.addTo(map_b5c1a18312c83bfd13d257d168d525ce);
                return cluster;
            })();
